<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XDM Integration Module</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img class="brand-mark" src="icon48.png" alt="" aria-hidden="true">
    <div class="brand-copy">
      <h1>XDM</h1>
      <p class="offline">Integration module offline</p>
    </div>
  </header>
  <main class="state-panel">
    <strong class="state-title">Unable to connect</strong>
    <p>Make sure XDM is running, then try again.</p>
    <button class="primary-button" id="OpenLink" type="button">Launch XDM</button>
  </main>
  <script src="error.js"></script>
</body>
</html>
